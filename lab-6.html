<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blood donation form</title>
</head>
<body style="background-color: rgb(0, 255, 200);">
    <div style="color: rgb(0, 200, 255);">
    <h1><strong><center>BLOOD DONATION FORM</center></strong></h1>
    <center> DONAR NAME : <input type="TEXT" name="TEXT" placeholder="ENTER NAME" /> <br><br>
    DATE OF BIRTH : <input type="DATE" name="DATE" /> <br><br>
    BLOOD TYPE : <select name="blood_type"><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option><option value="O+">O+</option><option value="O-">O-</option></select><br><br>
    E-MAIL : <input type="TEXT" name="TEXT" placeholder="ENTER E-MAIL" /> <br><br>
    PHONE : <input type="NUMBER" name="NUBER" placeholder="ENTER NUMBER" /> <br><br>
    AGE : <input type="NUMBER" name="NUMBER" placeholder="ENTER YOUR AGE" /> <br><br>
    GENDER : <select name="GENDER"><option value="MALE">MALE</option><option value="FEMALE">FEMALE</option></select><br><br>
    STATE : <input type="STATE" name="STATE" placeholder="ENTER YPUR STATE" /> <br><br>
    CITY : <input type="TEXT" name="TEXT" placeholder="ENTER YOUR CITY" /> <br><br>
    ADDRESS :<textarea rows="5" cols="30" placeholder="ENTER YOUR ADDRESS"></textarea><br><br>

    <button>registration</button></center>
</body>
</html>
