<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>In-Page Navigation Example</title>
</head>
<body>

    <!-- Navigation Menu at the Top -->
    <nav>
        <p>Jump to:</p>
        <ul>
            <li><a href="#section-about">About Us</a></li>
            <li><a href="#section-contact">Contact Info</a></li>
        </ul>
    </nav>

    <hr>

    <!-- Page Content -->
    <div style="min-height: 800px;">
        <h2>Main Content</h2>
        <p>Scroll down or use the links above to jump directly to a section.</p>
    </div>

    <!-- Target Section 1 -->
    <section id="section-about" style="min-height: 600px;">
        <h2>About Us</h2>
        <p>This is the About Us section.</p>
        <a href="#top">Back to top</a>
    </section>

    <!-- Target Section 2 -->
    <section id="section-contact" style="min-height: 400px;">
        <h2>Contact Info</h2>
        <p>This is the Contact section.</p>
        <a href="#top">Back to top</a>
    </section>
</body>
</html>
