<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .purple:hover{
            background-color: purple;
        }
        .blue:hover{
            background-color: blue;
        }
        .skyblue:hover{
            background-color: skyblue;
        }
        .gree:hover{
            background-color: green;
        }
        .yellow:hover{
            background-color: yellow;
        }
        .orange:hover{
            background-color: orange;
        }
        .red:hover{
            background-color: red;
        }
        .pink:hover{
            background-color: pink;
        }
        .cyan:hover{
            background-color: cyan;
        }
        table{
            margin: 50px auto;
        }
        th{
            height: 100px;
            width: 100px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th class="purple">A</th>
            <th class="blue">B</th>
            <th class="skyblue">C</th>
        </tr>
        <tr>
            <th class="green">D</th>
            <th class="yellow">E</th>
            <th class="orange">F</th>
        </tr>
        <tr>
            <th class="red">G</th>
            <th class="pink">H</th>
            <th class="cyan">I</th>
        </tr>
    </table>
</body>
</html>
